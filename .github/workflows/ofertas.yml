name: ofertas-bot

on:
  schedule:
    # Cada 30 minutos, solo de día: 8:17-20:47 en verano y 7:17-19:47 en invierno (hora de Madrid).
    # Nada de avisos de noche.
    - cron: "17,47 6-18 * * *"
  workflow_dispatch: {}

concurrency:
  group: ofertas-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # El estado (ofertas ya avisadas) se guarda en la caché de Actions.
      # Cada ejecución guarda una entrada nueva y restaura la más reciente.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ofertas-state-${{ github.run_id }}
          restore-keys: ofertas-state-

      - name: Buscar ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_EMAIL: ${{ secrets.ALERTS_EMAIL }}
          ALERTS_EMAIL_PASSWORD: ${{ secrets.ALERTS_EMAIL_PASSWORD }}
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: go run ./cmd/ofertas-bot -once

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: ofertas-state-${{ github.run_id }}
